<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saveback</title>
  <style>
    body { font: 13px system-ui, sans-serif; width: 320px; margin: 12px; }
    label { display: block; margin: 8px 0 2px; }
    input { box-sizing: border-box; width: 100%; padding: 4px; }
    button { margin-top: 12px; padding: 6px 12px; }
    #result { margin-top: 10px; min-height: 2.6em; white-space: pre-wrap; }
  </style>
</head>
<body>
  <label for="endpoint">Endpoint</label>
  <input id="endpoint" type="url" placeholder="http://127.0.0.1:7777">
  <label for="token">Token (optional)</label>
  <input id="token" type="password" autocomplete="off">
  <button id="capture">Capture</button>
  <div id="result" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
