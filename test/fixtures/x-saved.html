<!doctype html>
<html><body>
<main>
<div data-testid="primaryColumn">
<section aria-label="Timeline: Bookmarks">
<div>
<article data-testid="tweet" role="article">
  <div data-testid="UserAvatar-Container-testuser"><img alt="" src="https://pbs.twimg.com/profile_images/1/avatar_normal.jpg"></div>
  <div data-testid="User-Name">
    <a href="/testuser" role="link"><span>Test User</span></a>
    <a href="/testuser" role="link"><span>@testuser</span></a>
    <a href="/testuser/status/1234567890123456789" role="link"><time datetime="2026-11-01T10:00:00.000Z">Nov 1</time></a>
  </div>
  <div data-testid="tweetText" lang="en"><span>Sample post text</span></div>
</article>
</div>
<div>

      <span>Quoted User</span><span>@quoteduser</span>

</article>
</div>
<div>
